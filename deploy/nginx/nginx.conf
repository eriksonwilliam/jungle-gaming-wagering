worker_processes auto;

events {
  worker_connections 1024;
}

http {
  log_format upstream_log '$remote_addr - [$time_local] "$request" $status upstream=$upstream_addr';
  access_log /dev/stdout upstream_log;

  # A concorrência é resolvida no Postgres (lock por wallet), não aqui —
  # round-robin simples é suficiente: qualquer instância pode atender
  # qualquer wallet. Ver ARCHITECTURE.md §10.3.
  upstream wagering_backend {
    server app1:3000;
    server app2:3000;
    server app3:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://wagering_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # requisições de escrita não devem ser reenviadas para outra
      # instância em caso de falha — o provedor decide o retry via
      # Idempotency-Key, não o proxy.
      proxy_next_upstream off;
    }
  }
}
